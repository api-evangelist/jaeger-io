name: Jaeger Collector — Span Ingest
slug: collector-ingest
version: 0.1.0
description: |-
  Accept span batches from instrumented services. The Collector exposes
  multiple write surfaces — native Jaeger api_v2, OTLP, and Zipkin — and
  writes accepted spans to the configured storage backend (Cassandra,
  OpenSearch, Elasticsearch, ClickHouse, Kafka, or Badger).
api:
  id: jaeger:jaeger-collector-api
  openapi: openapi/jaeger-collector-api-openapi.yml
operations:
  - operationId: postSpans
    method: POST
    path: /api/v2/spans
    summary: Submit a batch of Jaeger spans (native protobuf or JSON).
  - method: POST
    path: /v1/traces
    summary: Submit OTLP spans over HTTP (port 4318).
    notes: Implemented by the embedded OpenTelemetry Collector receiver in Jaeger v2.
  - method: POST
    path: /api/v1/spans
    summary: Submit Zipkin v1 spans (port 9411).
  - method: POST
    path: /api/v2/spans
    summary: Submit Zipkin v2 spans (port 9411).
inputs:
  - name: batch.process.serviceName
    type: string
    required: true
  - name: batch.spans
    type: object[]
    required: true
governance:
  authentication: None by default; secure via mTLS / reverse proxy.
  ports:
    - 4317/gRPC — OTLP
    - 4318/HTTP — OTLP
    - 9411/HTTP — Zipkin
    - 14250/gRPC — Jaeger api_v2 native
    - 14268/HTTP — Jaeger legacy Thrift HTTP
