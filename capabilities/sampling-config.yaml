name: Jaeger Sampling Manager — Remote Sampling
slug: sampling-config
version: 0.1.0
description: |-
  Distribute sampling strategies to instrumented services. Tracer SDKs poll
  the Sampling Manager to learn the active strategy (probabilistic,
  rate-limiting, or per-operation) for their service, enabling central
  control of trace volume without redeploying applications.
api:
  id: jaeger:jaeger-sampling-api
  openapi: openapi/jaeger-sampling-api-openapi.yml
operations:
  - operationId: getSamplingStrategy
    method: POST
    path: /api/v2/samplingStrategy
    summary: Fetch the current sampling strategy for a service (gRPC-gateway form).
  - operationId: getSamplingStrategyLegacy
    method: GET
    path: /sampling
    summary: Legacy HTTP form used by older Jaeger SDKs.
inputs:
  - name: serviceName
    type: string
    required: true
outputs:
  - name: strategy
    type: object
    description: SamplingStrategyResponse — union of probabilistic, rate-limiting, and per-operation strategies.
governance:
  port: 5778 (HTTP) / 5779 (gRPC)
  notes: Strategies are configured via Collector --sampling.strategies-file or via the adaptive sampling subsystem.
